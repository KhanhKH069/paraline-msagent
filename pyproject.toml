[project]
name = "nllb-trainer"
version = "0.1.0"
description = "NLLB Contextual Trainer — JA / EN / VI"
requires-python = ">=3.10"
dependencies = [
    # Core ML
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "tokenizers>=0.15.0",
    "sentencepiece>=0.1.99",
    "accelerate>=0.27.0",
    "peft>=0.9.0",

    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",

    # NLP / Chunking
    "spacy>=3.7.0",

    # Evaluation metrics
    "sacrebleu>=2.3.0",
    "evaluate>=0.4.0",
    "nltk>=3.8.0",

    # Training utilities
    "wandb>=0.16.0",
    "tensorboard>=2.14.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",

    # Config & CLI
    "pyyaml>=6.0",
    "hydra-core>=1.3.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",

    # Data download / corpus
    "opuscleaner>=0.2.0",

    # Notebook
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
