version: "3.9"

# Local-optimized compose:
# - Expose only what the Windows client needs (8056 + 8765)
# - Keep internal services private to the Docker network
# - Still includes Vision + Agent (as requested)

networks:
  meeting-net:
    driver: bridge

volumes:
  models-cache:
    name: meeting-models-cache
    external: true
  postgres-data:
  redis-data:


services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: meeting-api-gateway
    ports:
      - "8056:8056" # REST + Swagger
      - "8765:8765" # WebSocket audio stream
    volumes:
      - ./services/api-gateway:/app
    environment:
      - WHISPERLIVE_URL=http://whisperlive:8001
      - TRANSLATION_URL=http://translation-service:8002
      - TTS_URL=http://tts-service:8003
      - AGENT_URL=http://agent-service:8005
      - COLLECTOR_URL=http://transcription-collector:8006
      - REDIS_URL=redis://redis:6379
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - CLIENT_API_KEY=${CLIENT_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - whisperlive
      - translation-service
      - tts-service
      #      - vision-service
      #      - agent-service
      - transcription-collector
      - redis
    networks: [ meeting-net ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8056/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  whisperlive:
    build:
      context: ./services/whisperlive-wrapper
      dockerfile: Dockerfile
    container_name: meeting-whisperlive
    volumes:
      - models-cache:/models
      - ./services/whisperlive-wrapper:/app
    environment:
      - ASR_BACKEND=${ASR_BACKEND:-faster_whisper}
      - QWEN_ASR_MODEL=${QWEN_ASR_MODEL:-Qwen/Qwen3-ASR-0.6B}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cuda}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - MODEL_CACHE_DIR=/models/whisper
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "8001:8001"
    networks: [ meeting-net ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  translation-service:
    build:
      context: ./services/translation-service
      dockerfile: Dockerfile
    container_name: meeting-nllb
    volumes:
      - models-cache:/models
      - ./services/translation-service:/app
    environment:
      - NLLB_MODEL=facebook/nllb-200-distilled-600M
      - MODEL_CACHE_DIR=/models/nllb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    ports:
      - "8002:8002"
    networks: [ meeting-net ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 60s
      start_period: 90s

  tts-service:
    build:
      context: ./services/tts-service
      dockerfile: Dockerfile
    container_name: meeting-piper
    volumes:
      - models-cache:/models
    environment:
      - PIPER_VOICE=vi_VN-vivos-medium
      - MODEL_CACHE_DIR=/models/piper
      - SAMPLE_RATE=22050
    ports:
      - "8003:8003"
    networks: [ meeting-net ]
    restart: unless-stopped

  transcription-collector:
    build:
      context: ./services/transcription-collector
      dockerfile: Dockerfile
    container_name: meeting-collector
    volumes:
      - ./services/transcription-collector:/app
    environment:
      - DATABASE_URL=postgresql://meeting:${DB_PASSWORD:-meeting_strong_password}@postgres:5432/meeting
      - REDIS_URL=redis://redis:6379
    depends_on: [ postgres, redis ]
    networks: [ meeting-net ]
    restart: unless-stopped

  #  agent-service:
  #    build:
  #      context: ./services/agent-service
  #      dockerfile: Dockerfile
  #    container_name: meeting-agent
  #    environment:
  #      - OLLAMA_HOST=http://ollama:11434
  #      - LLM_MODEL=${LLM_MODEL:-llama3:8b}
  #      - COLLECTOR_URL=http://transcription-collector:8006
  #    depends_on: [ollama, transcription-collector]
  #    networks: [meeting-net]
  #    restart: unless-stopped

  #  ollama:
  #    image: ollama/ollama:latest
  #    container_name: meeting-ollama
  #    volumes:
  #      - models-cache:/root/.ollama
  #    networks: [meeting-net]
  #    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: meeting-postgres
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meeting_strong_password}
      POSTGRES_DB: meeting
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/database/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [ meeting-net ]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: meeting-redis
    volumes:
      - redis-data:/data
    networks: [ meeting-net ]
    restart: unless-stopped
